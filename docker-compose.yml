services:
  train:
    build:
      context: .
      dockerfile: docker/Dockerfile.train
    container_name: purchase_intent_train
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
      - ./mlruns:/app/mlruns

  api:
    depends_on:
      train:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: purchase_intent_api
    environment:
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: purchase_intent_dashboard
    environment:
      PYTHONPATH: /app
      DASHBOARD_API_URL: http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models:ro
      - ./reports:/app/reports:ro
    depends_on:
      api:
        condition: service_started

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    container_name: purchase_intent_mlflow
    command: mlflow server --backend-store-uri sqlite:////mlruns/mlflow.db --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
