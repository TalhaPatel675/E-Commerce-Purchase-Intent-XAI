name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Black
        run: python -m black --check src dashboard tests
      - name: Ruff
        run: python -m ruff check src dashboard tests
      - name: Pytest
        env:
          PYTHONPATH: .
        run: python -m pytest -q

  docker-build:
    needs: lint-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -f docker/Dockerfile.api -t purchase-intent-api:${{ github.sha }} .
      - name: Build dashboard image
        run: docker build -f docker/Dockerfile.dashboard -t purchase-intent-dashboard:${{ github.sha }} .
