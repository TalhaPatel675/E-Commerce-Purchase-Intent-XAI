[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These entry points add the project root to sys.path before importing src.*,
# so they also work when launched directly. E402 is intentional in these files.
"dashboard/app.py" = ["E402"]
"src/api/main.py" = ["E402"]
"src/explain/shap_lime.py" = ["E402"]
"src/models/train.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
